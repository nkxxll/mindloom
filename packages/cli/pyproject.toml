[project]
name = "mindloom-cli"
version = "0.1.0"
description = "Mindloom CLI client"
requires-python = ">=3.14"
dependencies = [
    "click>=8.0",
    "httpx>=0.28",
    "mindloom-core",
    "rich>=14.3.3",
]

[tool.uv.sources]
mindloom-core = { workspace = true }

[project.scripts]
mlc = "mindloom_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindloom_cli"]
